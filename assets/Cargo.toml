[package]
name = "feather-assets"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
glam.workspace = true
serde.workspace = true
# `import` resolves buffers/URIs and decodes images (png/jpeg via the image
# crate); `utils` gives the mesh accessor readers.
gltf = { version = "1", default-features = false, features = ["import", "utils"] }
