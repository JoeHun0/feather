[package]
name = "feather-assets"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
glam.workspace = true
# Content key for baked textures (§17), shared by the bake tool and the runtime.
xxhash-rust.workspace = true
serde.workspace = true
# `import` resolves buffers/URIs and decodes images (png/jpeg via the image
# crate); `utils` gives the mesh accessor readers; `extras` exposes each node's
# `extras` JSON (§18 prefab data); `names` makes load warnings able to say which
# node is at fault.
gltf = { version = "1", default-features = false, features = [
    "import",
    "utils",
    "extras",
    "names",
] }
# Already in the tree via gltf's `extras`, which hands back a raw JSON value.
serde_json = "1"
# Images are read as *encoded* bytes and decoded lazily (§17), so a baked
# texture is never decoded. All three were already in the tree via gltf's
# `import`; these are the same versions and features.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.13"
urlencoding = "2"
