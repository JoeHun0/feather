[workspace]
resolver = "2"
members = ["platform", "gfx", "render", "assets", "game", "app", "bake"]
# Plain `cargo run` means the game: with feather-bake in the workspace there
# are two binaries, and without this cargo refuses to guess.
default-members = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# external
ash               = "0.38"
ash-window        = "0.13"
raw-window-handle = "0.6"
winit             = "0.30"
vk-mem            = "0.4"
glam              = "0.29"
bevy_ecs          = { version = "0.16", features = ["multi_threaded"] }
rapier3d          = "=0.35.3"
serde             = { version = "1", features = ["derive"] }
shaderc           = "0.8"
# texture bake (§17): BC7 encoder (bake crate only) and the content-hash key
intel_tex_2       = "0.5"
# mesh bake (§17): vertex-cache/fetch optimisation + LOD simplification
# (bake crate only)
meshopt           = "0.6"
xxhash-rust       = { version = "0.8", features = ["xxh3"] }
# internal (path deps, referenced as `<crate>.workspace = true`)
feather-platform = { path = "platform" }
feather-gfx      = { path = "gfx" }
feather-render   = { path = "render" }
feather-assets   = { path = "assets" }
feather-game     = { path = "game" }

# Optimise dependencies even in debug builds; the engine's own crates stay at
# full debug. Measured on the detail scene: building rapier colliders took
# 2-10 s unoptimised vs 0.6-1.6 s, and rapier's per-tick cost against dense
# meshes is ~10x higher unoptimised. Cost: a clean build goes from ~41 s to
# ~62 s; incremental builds of our own crates are unaffected.
[profile.dev.package."*"]
opt-level = 3
